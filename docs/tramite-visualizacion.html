<style>
  :root { --bg:#0f1419; --panel:#1b2129; --ink:#e6edf3; --muted:#9aa7b2; --line:#2b333d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #app { display:grid; grid-template-columns:300px 1fr; grid-template-rows:auto 1fr; height:100vh; }
  #app > aside, #app > .stage { min-width:0; min-height:0; }
  header { grid-column:1 / 3; padding:12px 18px; border-bottom:1px solid var(--line);
    background:var(--panel); display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:650; }
  header .sub { color:var(--muted); font-size:12px; }
  header .stat { color:var(--muted); font-size:12px; }
  header .stat b { color:var(--ink); }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:14px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    margin:0 0 8px; }
  .leg { display:flex; align-items:center; gap:8px; font-size:13px; margin:5px 0; }
  .dot { width:13px; height:13px; border-radius:50%; flex:0 0 auto; }
  .controls { margin:14px 0; display:flex; flex-direction:column; gap:8px; }
  .controls button, .controls label { font-size:13px; }
  .controls button { background:#222c36; color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:7px 10px; cursor:pointer; text-align:left; }
  .controls button:hover { background:#2b3742; }
  .controls button.on { border-color:#ef6c00; color:#ffb74d; }
  .edges-key { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.7; }
  .edges-key span { display:inline-block; width:26px; vertical-align:middle; margin-right:6px; }
  #net { position:absolute; inset:0; }
  #info { position:absolute; right:14px; top:64px; width:320px; max-height:70vh; overflow:auto;
    background:rgba(27,33,41,.97); border:1px solid var(--line); border-radius:10px; padding:14px;
    font-size:13px; display:none; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #info h3 { margin:0 0 4px; font-size:15px; }
  #info .iri { color:var(--muted); font-size:11px; word-break:break-all; margin-bottom:8px; }
  #info .grp { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    color:#0f1419; font-weight:600; margin-bottom:8px; }
  #info p { margin:6px 0; line-height:1.45; }
  #info .rel { color:var(--muted); }
  #info .rel b { color:var(--ink); font-weight:600; }
  #info .close { float:right; cursor:pointer; color:var(--muted); }
  .stage { position:relative; min-width:0; min-height:0; }
</style>
</head>

<script>
const DATA = {"nodes": [{"id": "https://w3id.org/medellin/espacio-publico/core#Lugar", "label": "Lugar", "group": "lugar", "iri": "Lugar", "def": "Ubicacion fisica en el territorio urbano. Clase ABSTRACTA:\n    no se instancia directamente; sus instancias son siempre un :PuestoVenta o una\n    :Vivienda. Su estado fundamental (existente/demolido, habilitado/en_obras) NO es\n    controlado por la Subsecretaria de Espacio Publico."}, {"id": "https://w3id.org/medellin/espacio-publico/core#PersonaNatural", "label": "Persona Natural", "group": "persona", "iri": "PersonaNatural", "def": "Individuo con existencia independiente de la institucion. Su ciclo\n    de vida fundamental (vivo/fallecido) NO es controlado por la Subsecretaria de Espacio\n    Publico. La institucion puede asignarle ROLES (vendedor informal, organizador de evento,\n    etc.) pero la persona existe independientemente de estos roles.\n\n    Hereda de foaf:Person para compatibilidad con ontologias W3C y reutilizar\n    propiedades estandar como foaf:name, foaf:mbox, foaf:based_near."}, {"id": "https://w3id.org/medellin/espacio-publico/core#PuestoVenta", "label": "Puesto de Venta", "group": "lugar", "iri": "PuestoVenta", "def": "Unidad operativa donde un VendedorInformalRegulado ejerce su\n    actividad economica en el espacio publico. Representa la ocupacion autorizada\n    incluyendo dimensiones, actividad economica, horarios y equipamiento.\n\n    Es un :Lugar (hereda direccion, barrio, comuna, latitud, longitud): la ubicacion\n    geografica del puesto se modela directamente sobre el PuestoVenta, no sobre una\n    entidad :Lugar separada. :Lugar queda como clase abstracta padre de :PuestoVenta\n    y :Vivienda.\n\n    Incorpora ademas:\n    - Modulo (opcional): Infraestructura fisica asignada (subclase :Modulo)\n    - Actividad economica y tipologia\n    - Dimensiones y area de ocupacion"}, {"id": "https://w3id.org/medellin/espacio-publico/core#Vivienda", "label": "Vivienda", "group": "lugar", "iri": "Vivienda", "def": "Lugar de residencia de una persona o familia. Relevante para\n    visitas domiciliarias, caracterizacion socioeconomica y evaluacion de condiciones\n    de vulnerabilidad. Su estado fisico no es controlado por la institucion.\n    Es un :Lugar (hereda direccion, barrio, comuna, municipio, latitud, longitud)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ActoAdministrativo", "label": "Acto administrativo (entregable)", "group": "acto", "iri": "ActoAdministrativo", "def": "[ACTO_ADMINISTRATIVO] Entregable del tramite: decision que autoriza o niega."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionAprovechamiento", "label": "Aprobacion de Aprovechamiento", "group": "acto", "iri": "AprobacionAprovechamiento", "def": "Acto que resuelve FAVORABLEMENTE: autoriza el aprovechamiento temporal del lugar."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionPermiso", "label": "Aprobacion de Permiso (venta informal)", "group": "acto", "iri": "AprobacionPermiso", "def": "Acto administrativo favorable que ES la respuesta del tramite: autoriza la\n    venta informal, porta las condiciones de la ocupacion (vigencia, area, horarios, puesto) y\n    genera el carnet del vendedor. No se modela un permiso aparte; el acto administrativo cumple\n    ese rol."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionAmoblamientoUrbano", "label": "Autorizacion - Amoblamiento urbano", "group": "categoria", "iri": "AutorizacionAmoblamientoUrbano", "def": "Categoria que autoriza el aprovechamiento de mobiliario urbano (mupis,\n    paraderos, modulos, cabinas) con fines economicos o publicitarios."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionAvisosPublicitarios", "label": "Autorizacion - Avisos publicitarios", "group": "categoria", "iri": "AutorizacionAvisosPublicitarios", "def": "Categoria que autoriza avisos publicitarios y publicidad exterior visual en\n    el espacio publico (vallas, avisos, pendones) con aprovechamiento economico."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionEventosOcasionales", "label": "Autorizacion - Eventos ocasionales", "group": "categoria", "iri": "AutorizacionEventosOcasionales", "def": "Categoria que autoriza el uso temporal del espacio publico para eventos\n    ocasionales con aprovechamiento economico (ferias, mercados, actividades comerciales o\n    culturales)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionMesasYSillas", "label": "Autorizacion - Mesas y sillas", "group": "categoria", "iri": "AutorizacionMesasYSillas", "def": "Categoria que autoriza el uso del espacio publico con mesas y sillas anexas a un\n    establecimiento de comercio formal (restaurantes, cafes, bares) frente a su fachada."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionParqueaderos", "label": "Autorizacion - Parqueaderos", "group": "categoria", "iri": "AutorizacionParqueaderos", "def": "Categoria que autoriza el aprovechamiento del espacio publico como\n    parqueadero, con o sin actividad economica asociada."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionParquesDiversiones", "label": "Autorizacion - Parques de diversiones", "group": "categoria", "iri": "AutorizacionParquesDiversiones", "def": "Categoria que autoriza la instalacion temporal de atracciones mecanicas y\n    parques de diversiones en el espacio publico."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AutorizacionVentaInformal", "label": "Autorizacion - Venta informal", "group": "categoria", "iri": "AutorizacionVentaInformal", "def": "Categoria de venta informal del tramite SUIT 26521 (vendedores informales con una venta)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Carnet", "label": "Carnet del vendedor", "group": "acto", "iri": "Carnet", "def": "Credencial emitida al titular de la Aprobacion de Permiso (acto administrativo favorable)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#CertificadoManipulacionAlimentos", "label": "Certificado de manipulacion de alimentos", "group": "documento", "iri": "CertificadoManipulacionAlimentos", "def": ""}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoCruceInterinstitucional", "label": "Concepto de Cruce Interinstitucional", "group": "concepto", "iri": "ConceptoCruceInterinstitucional", "def": "Verificacion contra bases interinstitucionales (SISBEN, Catastro, RUNT, RUES, SISPRO, RUV, Revalidacion, SISDEP). Captura: FO-GGOL-022 v4."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoLegalidad", "label": "Concepto de Legalidad", "group": "concepto", "iri": "ConceptoLegalidad", "def": "Verificacion juridica de requisitos, identificacion, antecedentes y capacidad juridica."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoSanitario", "label": "Concepto Sanitario", "group": "concepto", "iri": "ConceptoSanitario", "def": "Condiciones sanitarias para alimentos preparados. OBLIGATORIO en esa actividad."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoSeguridad", "label": "Concepto de Seguridad", "group": "concepto", "iri": "ConceptoSeguridad", "def": "Antecedentes, convivencia y orden publico de la ocupacion solicitada."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoSocioeconomico", "label": "Concepto Socioeconomico", "group": "concepto", "iri": "ConceptoSocioeconomico", "def": "Concepto que evalua la situacion socioeconomica y la vulnerabilidad del\n    solicitante (SISBEN, proteccion constitucional, victima, discapacidad, cabeza de familia,\n    linea de pobreza). Se sustenta en el estudio socioeconomico (FO-GOOL-044) y en el cruce\n    interinstitucional (FO-GGOL-022). Captura: FO-GGOL-016 v8. Grado >=3 recomienda exencion\n    de retribucion."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoTecnico", "label": "Concepto Tecnico", "group": "concepto", "iri": "ConceptoTecnico", "def": "ABSTRACTA (propia): dictamen tecnico/juridico que sustenta la decision."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoUrbano", "label": "Concepto Urbano", "group": "concepto", "iri": "ConceptoUrbano", "def": "Viabilidad urbanistica: compatibilidad con POT, disponibilidad espacial, movilidad."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ConceptoViabilidadAPP", "label": "Concepto de Viabilidad APP (retribucion economica)", "group": "concepto", "iri": "ConceptoViabilidadAPP", "def": "Concepto de la Agencia APP que valora el aprovechamiento economico y\n    calcula la retribucion. Si el ConceptoSocioeconomico determina exencion, la retribucion\n    puede ser cero."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#CuentaServicios", "label": "Ultima cuenta de servicios publicos", "group": "documento", "iri": "CuentaServicios", "def": ""}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#DocIdentidad", "label": "Documento de identidad", "group": "documento", "iri": "DocIdentidad", "def": ""}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#DocumentoSoporte", "label": "Documento soporte / anexo", "group": "documento", "iri": "DocumentoSoporte", "def": "[DOCUMENTO_SOPORTE] Documento aportado por el solicitante como requisito."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Estudio", "label": "Estudio", "group": "estudio", "iri": "Estudio", "def": "ABSTRACTA (propia): documento de caracterizacion insumo de los conceptos."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#EstudioSocioeconomico", "label": "Estudio Socioeconomico", "group": "estudio", "iri": "EstudioSocioeconomico", "def": "Caracterizacion socioeconomica integral del vendedor y su nucleo familiar\n    (FO-GOOL-044 v9). Insumo principal del ConceptoSocioeconomico; requiere visita domiciliaria\n    previa (FO-GGOL-028)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Evento", "label": "Evento", "group": "evento", "iri": "Evento", "def": "ABSTRACTA (propia): diligencia situada en el tiempo y en un :Lugar (p.ej. visitas)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Formulario", "label": "Formulario / formato de captura", "group": "formulario", "iri": "Formulario", "def": "[FORMULARIO] Instrumento oficial de captura (FO-GGOL-XXX / SUIT)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#MiembroGrupoFamiliar", "label": "Miembro del Grupo Familiar", "group": "estudio", "iri": "MiembroGrupoFamiliar", "def": "Cada integrante del grupo familiar del vendedor (FO-GOOL-044 seccion 9)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#NegacionAprovechamiento", "label": "Negacion de Aprovechamiento", "group": "acto", "iri": "NegacionAprovechamiento", "def": "Acto que resuelve DESFAVORABLEMENTE. Contra el proceden los recursos de ley."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#NegacionPermiso", "label": "Negacion de Permiso (venta informal)", "group": "acto", "iri": "NegacionPermiso", "def": "Acto que niega la solicitud (tipico de la ruta del no regulado, PR-GGOL-012). Contra el proceden los recursos de ley."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#PlanoArea", "label": "Plano del area de aprovechamiento", "group": "documento", "iri": "PlanoArea", "def": ""}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Procedimiento", "label": "Procedimiento administrativo interno", "group": "proceso", "iri": "Procedimiento", "def": "[PROCEDIMIENTO] Documento interno (PR-GGOL-XXX) que ejecuta una categoria."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ProcesoAdicionalModulo", "label": "Proceso adicional de asignacion de modulo", "group": "proceso", "iri": "ProcesoAdicionalModulo", "def": "Etapa ADICIONAL que solo aplica a la solicitud de Vendedor en Modulo:\n    asignacion/adjudicacion del modulo de venta dentro del E.P. (sobre el proceso comun)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#ProcesoVentaInformal", "label": "Proceso de autorizacion de venta informal", "group": "proceso", "iri": "ProcesoVentaInformal", "def": "Proceso comun a las dos modalidades de vendedor informal: radicacion\n    (FO-GGOL-026), estudio socioeconomico, conceptos tecnicos y decision (PR-GGOL-016)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudAmoblamientoUrbano", "label": "Solicitud - Amoblamiento urbano", "group": "solicitud", "iri": "SolicitudAmoblamientoUrbano", "def": "Solicitud de la categoria amoblamiento urbano; se vuelve de este tipo cuando tipoTramite = cat-amoblamiento-urbano."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudAvisosPublicitarios", "label": "Solicitud - Avisos publicitarios", "group": "solicitud", "iri": "SolicitudAvisosPublicitarios", "def": "Solicitud de la categoria avisos publicitarios; se vuelve de este tipo cuando tipoTramite = cat-avisos-publicitarios."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudComercioFormal", "label": "Solicitud de tramite - Comercio formal", "group": "solicitud", "iri": "SolicitudComercioFormal", "def": "Clase de CONVENIENCIA que agrupa las solicitudes de comercio formal del\n    tramite SUIT 26521 (mesas y sillas, eventos ocasionales, parques de diversiones, amoblamiento\n    urbano, avisos publicitarios, parqueaderos). Una solicitud es de comercio formal cuando su\n    tipoTramite es una de esas 6 categorias; cada modalidad tiene su propia subclase definida."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudEventosOcasionales", "label": "Solicitud - Eventos ocasionales", "group": "solicitud", "iri": "SolicitudEventosOcasionales", "def": "Solicitud de la categoria eventos ocasionales; se vuelve de este tipo cuando tipoTramite = cat-eventos-ocasionales."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudMesasYSillas", "label": "Solicitud - Mesas y sillas", "group": "solicitud", "iri": "SolicitudMesasYSillas", "def": "Solicitud de la categoria mesas y sillas; se vuelve de este tipo cuando tipoTramite = cat-mesas-sillas."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudParqueaderos", "label": "Solicitud - Parqueaderos", "group": "solicitud", "iri": "SolicitudParqueaderos", "def": "Solicitud de la categoria parqueaderos (con o sin actividad economica); se vuelve de este tipo cuando tipoTramite = cat-parqueaderos."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudParquesDiversiones", "label": "Solicitud - Parques de diversiones", "group": "solicitud", "iri": "SolicitudParquesDiversiones", "def": "Solicitud de la categoria parques de diversiones; se vuelve de este tipo cuando tipoTramite = cat-parques-diversiones."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudTramite", "label": "Solicitud de tramite", "group": "solicitud", "iri": "SolicitudTramite", "def": "[SOLICITUD] Radicacion con que una persona inicia el tramite SUIT 26521.\n    Contiene una categoria (tst:tipoTramite) que la clasifica. Hay una subclase DEFINIDA por\n    cada categoria (SolicitudVentaInformal y, para comercio formal, SolicitudMesasYSillas,\n    SolicitudEventosOcasionales, SolicitudParquesDiversiones, SolicitudAmoblamientoUrbano,\n    SolicitudAvisosPublicitarios, SolicitudParqueaderos): una solicitud se vuelve de ese tipo\n    justamente cuando su tst:tipoTramite toma el valor de esa categoria. SolicitudComercioFormal\n    las agrupa por conveniencia."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudVendedorModulo", "label": "Solicitud - Vendedor en modulo", "group": "solicitud", "iri": "SolicitudVendedorModulo", "def": "Modalidad de venta informal del vendedor ubicado en un modulo de venta.\n    Sigue el MISMO proceso comun de venta informal y, ADEMAS, un proceso adicional de asignacion\n    del modulo (ProcesoAdicionalModulo)."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudVendedorSemiestacionarioAmbulante", "label": "Solicitud - Vendedor semiestacionario/ambulante", "group": "solicitud", "iri": "SolicitudVendedorSemiestacionarioAmbulante", "def": "Modalidad de venta informal del vendedor semiestacionario o ambulante.\n    Sigue UNICAMENTE el proceso comun de venta informal (ProcesoVentaInformal), sin etapa\n    adicional."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudVentaInformal", "label": "Solicitud de Autorizacion - Venta informal", "group": "solicitud", "iri": "SolicitudVentaInformal", "def": "Solicitud del vendedor informal para ejercer una venta en el espacio\n    publico (categoria 'venta informal' del tramite SUIT 26521). Se captura con FO-GGOL-026 y\n    se tramita segun PR-GGOL-016. Requiere conceptos tecnicos sustentados en el estudio\n    socioeconomico y produce un acto administrativo (aprobacion o negacion); la aprobacion\n    es la respuesta del tramite y genera el carnet."}, {"id": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SoporteSisben", "label": "Puntaje SISBEN actualizado", "group": "docume ellin/espacio-publico/tramite-solicitud-temporal#EstudioSocioeconomico", "to": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#MiembroGrupoFamiliar", "kind": "prop", "label": "tiene grupo familiar"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#EstudioSocioeconomico", "to": "https://w3id.org/medellin/espacio-publico/core#Vivienda", "kind": "bridge", "label": "estudio caracteriza vivienda"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#VisitaDomiciliaria", "to": "https://w3id.org/medellin/espacio-publico/core#Vivienda", "kind": "bridge", "label": "visita domiciliaria en vivienda"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#VisitaAdministrativa", "to": "https://w3id.org/medellin/espacio-publico/core#PuestoVenta", "kind": "bridge", "label": "visita administrativa en puesto"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionPermiso", "to": "https://w3id.org/medellin/espacio-publico/core#PuestoVenta", "kind": "bridge", "label": "puesto autorizado por el acto"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionPermiso", "to": "https://w3id.org/medellin/espacio-publico/core#PersonaNatural", "kind": "bridge", "label": "titular del acto"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionPermiso", "to": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#SolicitudVentaInformal", "kind": "prop", "label": "deriva de solicitud"}, {"from": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#AprobacionPermiso", "to": "https://w3id.org/medellin/espacio-publico/tramite-solicitud-temporal#Carnet", "kind": "prop", "label": "genera carnet"}, {"from": "https://w3id.org/medellin/espacio-publico/core#PuestoVenta", "to": "https://w3id.org/medellin/espacio-publico/core#Lugar", "kind": "bridge", "label": "opera en lugar"}], "legend": [{"group": "persona", "label": "Persona Natural (pilar QUIEN)", "color": "#e53935"}, {"group": "lugar", "label": "Lugar / PuestoVenta / Vivienda (pilar DONDE)", "color": "#1e88e5"}, {"group": "tramite", "label": "Tramite base", "color": "#6a1b9a"}, {"group": "solicitud", "label": "Solicitudes", "color": "#fb8c00"}, {"group": "categoria", "label": "Categorias / Autorizaciones", "color": "#00897b"}, {"group": "acto", "label": "Actos administrativos / entregables", "color": "#d81b60"}, {"group": "concepto", "label": "Conceptos tecnicos", "color": "#8e24aa"}, {"group": "estudio", "label": "Estudios", "color": "#6d4c41"}, {"group": "evento", "label": "Eventos / visitas", "color": "#00acc1"}, {"group": "proceso", "label": "Procesos / procedimientos", "color": "#43a047"}, {"group": "formulario", "label": "Formularios", "color": "#c0ca33"}, {"group": "documento", "label": "Documentos soporte", "color": "#78909c"}], "stats": {"classes": 53, "edges": 72, "bridges": 14, "sources": ["ontologies/domains/TramiteSolicitudTemporalAEEP/TramiteSolicitudTemporalAEEP.ttl", "ontologies/domains/TramiteSolicitudTemporalAEEP/categoria-venta-informal.ttl", "ontologies/domains/TramiteSolicitudTemporalAEEP/categorias-comercio-formal.ttl", "ontologies/core/persona-natural.ttl", "ontologies/core/lugar-puestoventa-vivienda.ttl"]}};
const GROUP_COLORS = {};
DATA.legend.forEach(l => GROUP_COLORS[l.group] = l.color);

// nodos
const nodes = new vis.DataSet(DATA.nodes.map(n => ({
  id: n.id, label: n.label, group: n.group,
  title: n.def || n.label,
  shape: (n.group==='persona'||n.group==='lugar') ? 'box' : 'dot',
  value: (n.group==='tramite') ? 30 : (n.group==='persona'||n.group==='lugar') ? 22 : 12,
  color: colorFor(n.group),
  font: { color:'#e6edf3', size:14, strokeWidth:3, strokeColor:'#0f1419' },
  _def: n.def, _iri: n.iri
})));

function colorFor(grp){
  const c = GROUP_COLORS[grp] || '#9e9e9e';
  return { background:c, border:shade(c,-25), highlight:{background:shade(c,18),border:'#fff'} };
}
function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+p,g=((n>>8)&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

const EDGE_STYLE = {
  subclass: { color:{color:'#9e9e9e',highlight:'#cfd8dc'}, dashes:false, width:1.3,
              arrows:{to:{enabled:true,scaleFactor:.6}}, smooth:{type:'cubicBezier'} },
  prop:     { color:{color:'#5c6bc0',highlight:'#9fa8da'}, dashes:[5,5], width:1.3,
              arrows:{to:{enabled:true,scaleFactor:.6}}, font:{color:'#9fa8da',size:11,strokeWidth:3,strokeColor:'#0f1419'} },
  bridge:   { color:{color:'#ef6c00',highlight:'#ffb74d'}, dashes:false, width:3,
              arrows:{to:{enabled:true,scaleFactor:.8}}, font:{color:'#ffb74d',size:12,strokeWidth:4,strokeColor:'#0f1419'} },
};
const edges = new vis.DataSet(DATA.edges.map((e,i) => Object.assign(
  { id:i, from:e.from, to:e.to, label:e.label||'', _kind:e.kind }, EDGE_STYLE[e.kind] )));

const net = new vis.Network(document.getElementById('net'), {nodes, edges}, {
  physics: { stabilization:{iterations:220}, barnesHut:{gravitationalConstant:-9000,springLength:150,springConstant:.035,avoidOverlap:.2} },
  interaction: { hover:true, tooltipDelay:120, navigationButtons:true, keyboard:false },
  nodes: { borderWidth:1.5 },
});

// stats + leyenda + fuentes
document.getElementById('stat').innerHTML =
  `<b>${DATA.stats.classes}</b> clases · <b>${DATA.stats.edges}</b> relaciones · `+
  `<b>${DATA.stats.bridges}</b> puentes a Persona/Lugar`;
document.getElementById('legend').innerHTML = DATA.legend.map(l =>
  `<div class="leg"><span class="dot" style="background:${l.color}"></span>${l.label}</div>`).join('');
document.getElementById('sources').innerHTML = DATA.stats.sources.join('<br>');

// panel de info al seleccionar nodo
const info = document.getElementById('info'), body = document.getElementById('infoBody');
document.getElementById('infoClose').onclick = ()=> info.style.display='none';
net.on('selectNode', p => {
  const n = nodes.get(p.nodes[0]);
  const outs = edges.get({filter:e=>e.from===n.id}).map(e=>`<div class="rel">→ <b>${e.label||'subclase'}</b> · ${nodes.get(e.to).label}</div>`);
  const ins  = edges.get({filter:e=>e.to===n.id}).map(e=>`<div class="rel">← <b>${e.label||'subclase'}</b> · ${nodes.get(e.from).label}</div>`);
  body.innerHTML =
    `<span class="close" id="x2">✕</span>`+
    `<span class="grp" style="background:${GROUP_COLORS[n.group]}">${n.group}</span>`+
    `<h3>${n.label}</h3><div class="iri">tst/core: ${n._iri}</div>`+
    (n._def?`<p>${n._def}</p>`:'')+
    (outs.length?`<p class="rel"><b>Salientes</b></p>${outs.join('')}`:'')+
    (ins.length?`<p class="rel"><b>Entrantes</b></p>${ins.join('')}`:'');
  info.style.display='block';
  document.getElementById('x2').onclick=()=>info.style.display='none';
});
net.on('click', p => { if(!p.nodes.length) info.style.display='none'; });

// controles
let bridgesOn=false, physicsOn=true;
const bB=document.getElementById('bBridges'), bP=document.getElementById('bPhysics');
bB.onclick = () => {
  bridgesOn=!bridgesOn; bB.classList.toggle('on',bridgesOn);
  edges.update(DATA.edges.map((e,i)=>{
    const base=EDGE_STYLE[e.kind]; if(!bridgesOn) return Object.assign({id:i},base);
    const dim = e.kind!=='bridge';
    return {id:i, color:{color: dim?'#2b333d':'#ef6c00'}, width: dim?0.6:3.5,
            font:{color: dim?'#3a434d':'#ffb74d',size:12,strokeWidth:4,strokeColor:'#0f1419'}};
  }));
  nodes.update(DATA.nodes.map(n=>{
    if(!bridgesOn) return {id:n.id, opacity:1};
    const isCore = n.group==='persona'||n.group==='lugar';
    const touches = DATA.edges.some(e=>e.kind==='bridge'&&(e.from===n.id||e.to===n.id));
    return {id:n.id, opacity:(isCore||touches)?1:0.25};
  }));
};
bP.onclick = () => { physicsOn=!physicsOn; net.setOptions({physics:{enabled:physicsOn}});
  bP.classList.toggle('on',physicsOn); bP.textContent='Fisica: '+(physicsOn?'activada':'desactivada'); };
document.getElementById('bFit').onclick = ()=> net.fit({animation:true});

// Asegura tamaño/encuadre aunque el contenedor se mida tarde.
function fitSoon(){ try { net.redraw(); net.fit({animation:false}); } catch(e){} }
net.once('stabilizationIterationsDone', fitSoon);
net.on('afterDrawing', function once(){ net.off('afterDrawing', once); fitSoon(); });
setTimeout(fitSoon, 400);
window.addEventListener('resize', ()=> net.redraw());
</script>
</body>
</html>
